[project]
name = "erpnext_notifications"
version = "0.1.0"
description = "Notificacoes push (PWA e web) para usuarios do ERPNext via Firebase Cloud Messaging (FCM v1)."
authors = [{ name = "GL SOLTEC", email = "contato@glsoltec.com.br" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "google-auth>=2.27,<3",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[build-system]
requires = ["flit_core"]
build-backend = "flit_core.buildapi"

[project.urls]
Repository = "https://github.com/glsoltec/erpnext-notifications"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "S"]
ignore = ["S101", "S324", "B008"]
