[project]
name = "erpnext_fcm"
version = "0.1.0"
description = "Envio de notificacoes push no ERPNext via Firebase Cloud Messaging (FCM v1)."
authors = [{ name = "GL SOLTEC", email = "contato@glsoltec.com.br" }]
requires-python = ">=3.10"
dependencies = [
    "google-auth>=2.0",
    "requests>=2.20",
]

[build-system]
requires = ["flit_core"]
build-backend = "flit_core.buildapi"

[project.urls]
Repository = "https://github.com/glsoltec/erpnext_fcm"
