name: ci

on:
  push:
    branches: [main, version-16]
  pull_request:

permissions:
  contents: read

jobs:
  lint-sast:
    name: Lint + SAST + Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: Ruff (lint + format check)
        run: ruff check erpnext_notifications && ruff format --check erpnext_notifications

      - name: Bandit (SAST)
        run: bandit -q -r erpnext_notifications -x tests -f json -o bandit.json

      - name: Detect secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deps:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit ".[dev]"

      - name: pip-audit
        run: pip-audit
